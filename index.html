<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>新竹之旅團購網</title>
    <style>
        :root { --travel-blue: #2e59a7; --classic-red: #a93226; --warm-bg: #fdfaf5; }
        body { font-family: "Microsoft JhengHei", sans-serif; background-color: #e9ecef; padding: 15px; margin: 0; }
        .container { max-width: 950px; background: white; padding: 25px; border-radius: 15px; box-shadow: 0 5px 25px rgba(0,0,0,0.2); margin: auto; border-top: 10px solid var(--travel-blue); }
        .header-section { text-align: center; margin-bottom: 20px; }
        h1 { color: var(--travel-blue); margin: 0; font-size: 28px; }
        .trip-slogan { color: #555; margin-top: 8px; font-weight: bold; font-size: 16px; line-height: 1.5; }
        .order-box { background: var(--warm-bg); border: 2px solid #ddd; padding: 20px; border-radius: 12px; margin-bottom: 30px; }
        #userName { width: 100%; padding: 12px; font-size: 18px; border: 2px solid var(--travel-blue); border-radius: 8px; box-sizing: border-box; }
        .menu-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 12px; margin: 20px 0; }
        .item-card { background: white; border: 1px solid #eee; padding: 12px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; }
        
        /* 強制顯示下拉選單樣式 */
        select.qty-in { 
            width: 90px !important; height: 45px !important; font-size: 18px !important; 
            border: 2px solid #2e59a7 !important; background: white !important; display: block !important;
        }

        .add-btn { width: 100%; padding: 15px; background: var(--travel-blue); color: white; border: none; border-radius: 8px; font-size: 20px; cursor: pointer; font-weight: bold; }
        .table-container { overflow-x: auto; margin-top: 15px; }
        table { width: 100%; border-collapse: collapse; min-width: 600px; }
        th, td { border: 1px solid #dee2e6; padding: 10px; text-align: center; }
        .summary-box { background: #f0f7ff; border: 2px solid var(--travel-blue); padding: 20px; margin-top: 30px; border-radius: 12px; }
        .summary-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; }
        .summary-card { background: white; padding: 10px; border-radius: 8px; text-align: center; border: 1px solid #bed6f7; }
        .footer-quote { text-align: center; margin-top: 30px; font-size: 20px; color: var(--classic-red); font-weight: bold; }
        .clear-btn { background: #888; color: white; border: none; padding: 10px; border-radius: 5px; margin-top: 10px; cursor: pointer; }
    </style>
</head>
<body>

<div class="container">
    <div class="header-section">
        <h1>🚍 新竹之旅團購網 🚍</h1>
        <p class="trip-slogan">風城石家真本味，師生雅集共嘗鮮</p>
    </div>
    
    <div class="order-box">
        <label style="font-weight:bold; color:var(--travel-blue);">👤 請輸入中文全名：</label>
        <input type="text" id="userName" placeholder="姓名" autocomplete="off">
        
        <div class="menu-grid">
            <div class="item-card"><span>包餡魚丸 (170元)</span>
                <select class="qty-in" data-name="包餡魚丸" data-price="170">
                    <option value="0">0</option><option value="1">1</option><option value="2">2</option><option value="3">3</option><option value="4">4</option><option value="5">5</option>
                </select>
            </div>
            <div class="item-card"><span>無包餡魚丸 (150元)</span>
                <select class="qty-in" data-name="無包餡魚丸" data-price="150">
                    <option value="0">0</option><option value="1">1</option><option value="2">2</option><option value="3">3</option><option value="4">4</option><option value="5">5</option>
                </select>
            </div>
            <div class="item-card"><span>原味貢丸 (190元)</span>
                <select class="qty-in" data-name="原味貢丸" data-price="190">
                    <option value="0">0</option><option value="1">1</option><option value="2">2</option><option value="3">3</option><option value="4">4</option><option value="5">5</option>
                </select>
            </div>
            <div class="item-card"><span>香菇貢丸 (190元)</span>
                <select class="qty-in" data-name="香菇貢丸" data-price="190">
                    <option value="0">0</option><option value="1">1</option><option value="2">2</option><option value="3">3</option><option value="4">4</option><option value="5">5</option>
                </select>
            </div>
            <div class="item-card"><span>福州燕丸 (220元)</span>
                <select class="qty-in" data-name="福州燕丸" data-price="220">
                    <option value="0">0</option><option value="1">1</option><option value="2">2</option><option value="3">3</option><option value="4">4</option><option value="5">5</option>
                </select>
            </div>
            <div class="item-card"><span>鮮蔥貢丸 (220元)</span>
                <select class="qty-in" data-name="鮮蔥貢丸" data-price="220">
                    <option value="0">0</option><option value="1">1</option><option value="2">2</option><option value="3">3</option><option value="4">4</option><option value="5">5</option>
                </select>
            </div>
        </div>
        <button class="add-btn" onclick="addToStat()">＋ 加入統計清單</button>
    </div>

    <div class="table-section">
        <h3>📋 訂購明細</h3>
        <div class="table-container">
            <table id="detailTable">
                <thead><tr><th>序號</th><th>姓名</th><th>內容</th><th>金額</th><th>操作</th></tr></thead>
                <tbody></tbody>
            </table>
        </div>
    </div>

    <div class="summary-box">
        <h3>🚚 團體下單總計</h3>
        <div id="summaryGrid" class="summary-grid"></div>
        <div style="text-align:right; font-size:24px; color:var(--classic-red); font-weight:bold; margin-top:15px;">
            總計：NT$ <span id="grandTotal">0</span>
        </div>
    </div>

    <div class="footer-quote">寒盡春生遊古蹟，師徒情誼永留心。</div>
    
    <div style="text-align:center; margin-top:20px;" class="print-hide">
        <button onclick="window.print()" style="padding:10px 20px;">列印/存PDF</button>
        <br>
        <button class="clear-btn" onclick="clearAllData()">⚠️ 清空所有資料(新開始)</button>
    </div>
</div>

<script>
    let allOrders = JSON.parse(localStorage.getItem('hsinchu_orders')) || []; 

    function saveToLocal() {
        localStorage.setItem('hsinchu_orders', JSON.stringify(allOrders));
    }

    function addToStat() {
        const nameInput = document.getElementById('userName');
        const name = nameInput.value.trim();
        if (!name) { alert("請輸入姓名"); return; }
        
        let currentOrder = { name: name, items: {}, personalTotal: 0 };
        const selects = document.querySelectorAll('.qty-in');
        let hasValue = false;

        selects.forEach(s => {
            const qty = parseInt(s.value);
            if (qty > 0) {
                const pName = s.getAttribute('data-name');
                const price = parseInt(s.getAttribute('data-price'));
                currentOrder.items[pName] = qty;
                currentOrder.personalTotal += (qty * price);
                hasValue = true;
            }
        });

        if (!hasValue) { alert("請選擇數量"); return; }
        allOrders.push(currentOrder);
        saveToLocal();
        updateDisplay();
        nameInput.value = '';
        selects.forEach(s => s.value = 0);
    }

    function removeOrder(i) {
        if(confirm("刪除此筆？")) { allOrders.splice(i, 1); saveToLocal(); updateDisplay(); }
    }

    function clearAllData() {
        if(confirm("確定要清空所有已輸入的資料嗎？(不可復原)")) {
            allOrders = [];
            localStorage.removeItem('hsinchu_orders');
            updateDisplay();
        }
    }

    function updateDisplay() {
        const tbody = document.querySelector('#detailTable tbody');
        tbody.innerHTML = '';
        let grandTotal = 0;
        let totals = {"包餡魚丸":0, "無包餡魚丸":0, "原味貢丸":0, "香菇貢丸":0, "福州燕丸":0, "鮮蔥貢丸":0};

        allOrders.forEach((order, i) => {
            let itemStr = Object.entries(order.items).map(([k,v]) => `${k}x${v}`).join(', ');
            tbody.innerHTML += `<tr><td>${i+1}</td><td>${order.name}</td><td style="text-align:left">${itemStr}</td><td>${order.personalTotal}</td><td><button onclick="removeOrder(${i})">刪除</button></td></tr>`;
            grandTotal += order.personalTotal;
            Object.entries(order.items).forEach(([k,v]) => totals[k] += v);
        });

        const grid = document.getElementById('summaryGrid');
        grid.innerHTML = '';
        Object.entries(totals).forEach(([k,v]) => {
            if(v > 0) grid.innerHTML += `<div class="summary-card"><strong>${k}</strong><br><span style="font-size:20px; color:#2e59a7;">${v}</span> 份</div>`;
        });
        document.getElementById('grandTotal').innerText = grandTotal.toLocaleString();
    }

    // 初始化讀取
    updateDisplay();
</script>
</body>
</html>
